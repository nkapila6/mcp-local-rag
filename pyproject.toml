[project]
name = "mcpsurfr"
version = "1.0.4"
authors = [{ name = "Nikhil Kapila", email = "info@nkapila.me" }]
description = "MCP \"server\" that can perform a web search locally without the use of APIs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "ddgs>=9.16.0",
  "fastmcp>=4.1.3,<4.2",
  "numpy>=2.3",
  "primp>=2.0.1",
]
classifiers = ["Programming Language :: Python :: 3.11"]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/nkapila6/mcpsurfr"
Issues = "https://github.com/nkapila6/mcpsurfr/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
mcpsurfr = "mcpsurfr.main:mcp.run"
# old name, so existing `uvx ... mcp-local-rag` configs keep working after the rename
mcp-local-rag = "mcpsurfr.main:mcp.run"

[tool.hatch.build.targets.sdist]
include = ["src/mcpsurfr"]
