name: Publish MCP Server to GitHub Container Registry

on:
  # Runs on pushes with a version attached to it
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Docker's reusable builder runs each platform on its own native runner
  # (arm64 on GitHub's arm runners, no QEMU) and merges them into one
  # multi-arch tag.
  publish-docker-image:
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      packages: write
      id-token: write # signs the build attestations
    with:
      output: image
      push: true
      platforms: linux/amd64,linux/arm64
      meta-images: ghcr.io/${{ github.repository }}
      meta-tags: |
        type=ref,event=tag
        type=raw,value=latest
      # MCP registry matches images to servers by this label
      meta-labels: |
        io.modelcontextprotocol.server.name=io.github.${{ github.repository }}
      cache: true
      cache-mode: max
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
